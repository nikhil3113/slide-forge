<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<meta
			name="description"
			content="SlideForge - AI-powered slide deck generation with live streaming."
		/>
		<script>
			try {
				if (localStorage.getItem("pptgen.theme") === "light") {
					document.documentElement.classList.remove("dark");
					document.documentElement.style.colorScheme = "light";
				}
			} catch {
				// ignore storage access errors
			}
		</script>
		<title>SlideForge - AI Slide Deck Generator</title>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
